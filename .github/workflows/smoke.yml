name: Smoke test APK on emulator

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to test (empty = latest)"
        required: false
        default: ""

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ${{ inputs.tag }} -R ${{ github.repository }} --pattern '*.apk' --output madplan.apk
          ls -la madplan.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, launch and capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: |
            adb install -r madplan.apk
            adb logcat -c
            adb shell monkey -p dk.digiida.madplan -c android.intent.category.LAUNCHER 1
            sleep 30
            adb exec-out screencap -p > screen.png
            adb logcat -d > logcat.txt
            grep -iE "flutter|AndroidRuntime|FATAL|madplan|Exception" logcat.txt | tail -200 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ inputs.tag || 'latest' }}
          path: |
            screen.png
            logcat.txt
