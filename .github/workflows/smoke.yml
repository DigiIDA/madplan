name: Smoke test APK on emulator

# Builds the release APK (R8 on, like real releases) and starts it on an
# emulator. Fails if the app throws during startup.
on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          cache: true
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: smoke-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, launch and capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: |
            adb install -r app-release.apk
            adb logcat -c
            adb shell monkey -p dk.digiida.madplan -c android.intent.category.LAUNCHER 1
            sleep 30
            adb exec-out screencap -p > screen.png
            adb shell input tap 200 600
            sleep 3
            adb shell input tap 150 160
            sleep 2
            adb shell input text "500%sg%spasta"
            adb shell input keyevent 66
            sleep 3
            adb shell am force-stop dk.digiida.madplan
            adb shell monkey -p dk.digiida.madplan -c android.intent.category.LAUNCHER 1
            sleep 15
            adb shell input tap 200 600
            sleep 3
            adb exec-out screencap -p > pantry-after-restart.png
            adb exec-out uiautomator dump /dev/tty > ui.xml || true
            adb logcat -d > logcat.txt
            ! grep -E "E flutter|FATAL EXCEPTION" logcat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-result
          path: |
            screen.png
            pantry-after-restart.png
            logcat.txt
