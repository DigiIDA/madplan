name: Scan smoke test on emulator

# Manual end-to-end check of recipe scanning (image picker + ML Kit OCR)
# on the R8-minified release APK.
on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          cache: true
      - run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk app-release.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: bash ci/scan_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scan-smoke
          path: |
            step-*.png
            ui.xml
            logcat.txt
