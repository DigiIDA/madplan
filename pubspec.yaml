name: madplan
description: Opskrifter, madplan, indkøbsliste og forslag ud fra det du har.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  file_picker: 13.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_mlkit_text_recognition: 0.17.1
  image_picker: 1.2.4
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: 0.14.4

flutter:
  uses-material-design: true
  fonts:
    - family: Arapey
      fonts:
        - asset: assets/fonts/Arapey-Regular.ttf
        - asset: assets/fonts/Arapey-Italic.ttf
          style: italic
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#BE5103"
  adaptive_icon_foreground: assets/icon/foreground.png
  adaptive_icon_foreground_inset: 0
